<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgBlue" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f296b" />
      <stop offset="50%" stop-color="#091945" />
      <stop offset="100%" stop-color="#050d26" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="60" y1="40" x2="450" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF078" />
      <stop offset="45%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <linearGradient id="bluePill" x1="120" y1="330" x2="392" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#FACC15" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Fond Bleu Royal profond style icône iOS -->
  <rect width="512" height="512" rx="112" fill="url(#bgBlue)" />

  <!-- Rayons subtils style plateau TV -->
  <g opacity="0.12">
    <path d="M256 256 L256 0 L320 0 Z" fill="#38BDF8" />
    <path d="M256 256 L512 120 L512 190 Z" fill="#FACC15" />
    <path d="M256 256 L512 360 L512 430 Z" fill="#38BDF8" />
    <path d="M256 256 L190 512 L120 512 Z" fill="#FACC15" />
    <path d="M256 256 L0 350 L0 280 Z" fill="#38BDF8" />
    <path d="M256 256 L0 120 L0 60 Z" fill="#FACC15" />
  </g>

  <!-- Cadre Plaque Parisienne "7 TER" Revisité en Or Électrique -->
  <rect x="34" y="34" width="444" height="444" rx="88" stroke="url(#goldGrad)" stroke-width="14" />
  <rect x="54" y="54" width="404" height="404" rx="70" stroke="#38BDF8" stroke-width="3" stroke-dasharray="12 8" opacity="0.55" />

  <!-- Étoiles décoratives aux coins -->
  <circle cx="92" cy="92" r="8" fill="#FACC15" />
  <circle cx="420" cy="92" r="8" fill="#FACC15" />
  <circle cx="92" cy="420" r="8" fill="#FACC15" />
  <circle cx="420" cy="420" r="8" fill="#FACC15" />

  <!-- Grand "7" et "TER" -->
  <g filter="url(#glow)">
    <text x="165" y="295" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="220" fill="url(#goldGrad)" letter-spacing="-6">7</text>
    <text x="335" y="232" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="88" fill="#FFFFFF" letter-spacing="2">TER</text>
    <rect x="248" y="254" width="174" height="14" rx="7" fill="url(#goldGrad)" />
  </g>

  <!-- Cartouche inférieur "LE GRAND QUIZ" -->
  <rect x="96" y="342" width="320" height="72" rx="36" fill="url(#goldGrad)" />
  <rect x="104" y="350" width="304" height="56" rx="28" fill="#091945" />
  <text x="256" y="389" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="34" fill="#FACC15" letter-spacing="8">QUIZ SHOW</text>
</svg>
