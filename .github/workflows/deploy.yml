name: Deploy Quiz to Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify full Next.js build (Server + API Routes)
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://bfpyeoeggxhaiyvvltbm.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_qW4Y_G7K9sk8Q8mO5TQleg_QGx2pc_7"
        run: npm run build

      - name: Build static export for GitHub Pages
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: "/quiz-trentenaires"
          NEXT_PUBLIC_SUPABASE_URL: "https://bfpyeoeggxhaiyvvltbm.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_qW4Y_G7K9sk8Q8mO5TQleg_QGx2pc_7"
        run: |
          rm -rf .next out
          mv app/api /tmp/nextjs_api_routes
          npm run build
          touch out/.nojekyll
          mv /tmp/nextjs_api_routes app/api

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
